[project]
name = "cad-playground-tools"
version = "0.1.0"
description = "Reproducible CAD playground inspection and modeling tools"
requires-python = ">=3.12,<3.13"
dependencies = [
    "trimesh>=4.12,<5",
    "scipy>=1.17,<2",
    "matplotlib>=3.10,<4",
    "freecad-mcp",
]

[tool.uv]
package = false

[tool.uv.sources]
freecad-mcp = { git = "https://github.com/neka-nat/freecad-mcp.git", rev = "8e14693a9b46b50a3656cbdd9c2922456bb3bd06" }
